name: update downloads

# 把 Release 的下载计数写回 plugins/index.json（市场里"下载量"排序与"下载 N 次"靠它）。
# 每天早上跑一次；手动 dispatch 也行。写不进去不会让 CI 红：统计失败只是这一项数据旧一天。
on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 推送必须用带 bypass 的 token；只给脚本步骤设 GH_TOKEN 是不够的 ——
          # checkout 会把默认 GITHUB_TOKEN 写进 git remote，下一步 git push 仍会被保护挡下。
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: "22.x"
      - run: node scripts/update-downloads.mjs
        env:
          # 优先用带 bypass 的 STATS_TOKEN；没有 secret 时退回 GITHUB_TOKEN（会被分支保护挡下）
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      # 有变化就提交（[skip ci] 避免再触发一轮 verify：计数变化不影响内容校验）
      - name: commit if changed
        run: |
          if [ -n "$(git status --porcelain plugins/index.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add plugins/index.json
            git commit -m "chore: 更新下载量 [skip ci]"
            # main 已开分支保护（必须走 PR + verify），GITHUB_TOKEN 不能直接推。
            # 推不上去就红：静默保留旧值会让下载量永远停在旧数（issue #10）。
            if ! git push; then
              echo "::error::下载量已统计但无法写回 main（分支保护禁止直接推送）"
              echo "检查 STATS_TOKEN 是否有效，或 main 的保护是否允许 GitHub Actions bypass。"
              exit 1
            fi
          else
            echo "没有变化"
          fi
